{% extends "_base.html" %}

{% block content %}


<main class="container">
    <h1>Comedor</h1>
    <div class="comgrid">
        <a class="btn" href="/comedor/newMenu">
            <div class="pictos">
                <img src="/static/picto/comida.png">
                <img src="/static/picto/botón de añadir.png">
            </div>
            Nuevo Menú
        </a>
        <a class="btn" href="/comedor/newMenu">
            <div class="pictos">
                <img src="/static/picto/comida.png">
                <img src="/static/picto/hoy.png">
            </div>
            Menú de hoy
        </a>
    </div>
    <h2>Menús</h2>
    <table border="" style="width: 300px;">
        <thead>
            <tr>
                <th>Menú</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for menu in menus %}
                <tr>
                    <th scope="row">
                        {{ menu.name }}
                    </th>
                    <td>
                        <a href="" class="btn">Abrir</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</main>

{% endblock %}
